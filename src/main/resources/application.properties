# ==========================================
# ESI Application Configuration (Weeks 5 & 6)
# ==========================================

spring.application.name=esi-project
server.port=${SERVER_PORT:8085}

# Which environment this instance is running as (overridden per profile below,
# and can also be passed directly as -Desi.environment=... or an env var).
esi.environment=local

# H2 Database In-Memory Configuration
spring.datasource.url=jdbc:h2:mem:esidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.esi=DEBUG
logging.level.org.springframework.web=INFO
